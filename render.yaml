# Render Blueprint: New → Blueprint → этот файл.
# Бесплатный API+WebSocket + Key Value, чтобы аккаунты не исчезали после sleep.
services:
  - type: web
    name: orakul-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: REDIS_URL
        fromService:
          name: orakul-kv
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: orakul-kv
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
