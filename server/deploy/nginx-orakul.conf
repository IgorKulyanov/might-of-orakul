server {
    listen 80;
    server_name kulyanov87.fvds.ru 157.22.204.47.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kulyanov87.fvds.ru 157.22.204.47.sslip.io;

    ssl_certificate /etc/letsencrypt/live/157.22.204.47.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/157.22.204.47.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Чат/PvP WebSocket: не рвать idle через 2 минуты
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
