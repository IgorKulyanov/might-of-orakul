# Blueprint для Render (можно Import).
# Тест: домашний ПК (HOME-HOST.md). Потом: Starter + disk, залить users.json.
services:
  - type: web
    name: orakul-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    disk:
      name: orakul-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: ORACUL_DATA_DIR
        value: /opt/render/project/src/data
