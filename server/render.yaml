# Blueprint для Render (можно Import).
# Или создай Web Service вручную: Root = server, Start = npm start.
services:
  - type: web
    name: orakul-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: "8787"
